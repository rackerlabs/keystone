---
features:
  - >
    [`bug 1515302 <https://bugs.launchpad.net/keystone/+bug/1515302>`_]
    Two new configuration options ``[ldap] user_enabled_emulation_use_group_config``
    and ``[ldap] project_enabled_emulation_use_group_config`` have been
    crated. They allow deployers to choose if they want to override the default
    group LDAP schema option.
