---
deprecations:
  - |
    For future proofing (per-domain PCI-DSS support) and for better overall
    architecture, the
    ``[security_compliance]\ lockout_ignored_user_ids``
    option has been deprecated in favor of the new ``ignore_passsword_lockout``
    value on the ``user`` object. The database data migration should set the
    value for any users currently set in the configuration value and Keystone
    will continue to support the use of the option until a future release.
    This was done to ensure that users can be exempted from the password
    lockouts without requiring a restart of the Keystone server.
