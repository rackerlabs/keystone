---
features:
  - The federated mapping engine now supports the ability
    to map federated (shadow) users into projects within the
    domain of the identity provider. If the project within the
    mapping doens't exist, it will be automatically created in
    the domain of the Identity Provider. This behavior can be done
    using a specific mapping syntax. This feature maintains
    support for existing mappings, but adds some enhancements
    to the mapping engine to enable auto-provisioning of
    resources in federated workflows.
