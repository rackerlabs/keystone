---
features:
  - >
    [`blueprint credential-encryption <https://blueprints.launchpad.net/keystone/+spec/credential-encryption>`_]
    Data stored in the `credentials` backend will now be encrypted. The mechanism
    used to encrypt the data is similar to what is used for `fernet tokens`.
    Refer to the ``keystone-manage credential_setup`` command and the `upgrade`
    section.
upgrade:
  - >
    [`blueprint credential-encryption <https://blueprints.launchpad.net/keystone/+spec/credential-encryption>`_]
    Keystone now supports encrypted credentials at rest. In order to upgrade
    successfully to Newton, deployers must encrypt all credentials currently
    stored before migating the database entries. Deployers must run
    the ``keystone-manage credential_setup`` command in order to use the
    credential API in Newton, or to finish the upgrade from Mitaka to Newton.

    If not using the rolling upgrade steps, this will result in a service outage
    for the credential API where credentials will be read-only for the duration
    of the upgrade process.
fixes:
 - >
   [`Bug 1619758 <https://bugs.launchpad.net/keystone/+bug/1619758>`_]
   Introduce a ``null`` key for credential encryption. To ease upgrades from
   Mitaka to Newton, a ``null`` key was added to credential encryption. The
   ``null`` key can be assumed if no other keys exists in the configured
   config option ``[credential] key_repository``.
