---
features:
  - Can now filter the /v3/users and /v3/groups/{group_id}/users
    queries with ``password_expires_at``, ``operator``, and a 
    ``timestamp``. It will return a list of users based on the 
    ``operator`` and ``timestamp`` given. The ``timestamp`` is in
    the format ``YYYY-MM-DDTHH:mm:ssZ``. The ``operator`` will
    compare the password expiration to the ``timestamp`` as follows:

    * lt: password expires before the timestamp
    * lte: password expires at or before timestamp
    * gt: password expires after the timestamp
    * gte: password expires at or after the timestamp
    * eq: password expires at the timestamp
    * neq: password expires not at the timestamp

