---
deprecations:
  - |
    ``[security_compliance]\ignore_password_expires_user_ids`` configuration
    option has been deprecated in favor of using the option value set (via
    RESTful API call on create/update of user) in
    ``user['options']['ignore_password_expiry']``. This change was done to
    allow each user to be flagged to ignore expired passwords via the API
    instead of requiring an update to the Keystone config and a restart of the
    service to take effect.