---
features:
  - |
    [`bug 2138725 <https://bugs.launchpad.net/keystone/+bug/2138725>`_]
    A pair of configuration options, ``[ldap] user_password_expiry_format_mapping``
    and ``[ldap] group_password_expiry_format_mapping`` have been added.
    These options allow Keystone to convert password expiration attributes from
    LDAP to the ``password_expires_at`` field on user objects.
    Not all LDAP servers enforce password expiry at bind time
    (e.g. OpenLDAP ``shadowAccount`` is informational only), so Keystone now
    checks expiration before the LDAP bind and returns a ``PasswordExpired``
    error, matching the SQL backend behaviour.

    The option accepts a list of ``<ldap_attribute>:<converter>`` pairs.
    Three built-in converters are provided:

    * ``epoch_days`` -- for RFC 2307 ``shadowAccount`` schemas
      (e.g. ``shadowExpire``), where the value is the number of days since
      the Unix epoch.
    * ``windows_filetime`` -- for Active Directory (e.g. ``accountExpires``),
      where the value is 100-nanosecond intervals since 1601-01-01.
    * ``generalized_time`` -- for LDAP ppolicy overlay
      (e.g. ``pwdExpirationTime``), using the ``YYYYMMDDHHmmSS.ffffffZ``
      format.
