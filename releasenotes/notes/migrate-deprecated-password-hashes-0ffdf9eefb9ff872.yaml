---
critical:
  - |
    The Epoxy release of Keystone drops support for passwords that were hashed 
    using the sha512_crypt algorithm.  As a result any passwords that are hashed 
    with sha512_crypt will not be readable in Epoxy.  This release adds the 
    ability for the SQL identity backend to update passwords that were hashed 
    with sha512_crypt. The rehashing is done when the user authenticates with 
    the correct password.