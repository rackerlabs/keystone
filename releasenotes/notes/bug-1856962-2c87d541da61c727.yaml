---
fixes:
  - |
    [bug 1856962 <https://bugs.launchpad.net/keystone/+bug/1856962>]
    In case of federated users with an empty federate group id list, authenticate
    using "openid" method will fail if cache expires. This patchset works around
    the problem by checking if federated group is none, instead of directly use
    it in if condition.
