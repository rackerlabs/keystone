---
features:
  - This adds a reason object to the CADF notifications that are emitted
    for the following events related to PCI-DSS.  (i) Change user
    passwords/passphrases at least once every X days; (ii) Limit repeated
    access attempts by locking out the user ID after not more than X
    attempts; (iii) Do not allow an individual to submit a new
    password/passphrase that is the same as any of the last X
    passwords/passphrases he or she has used; (iv) Passwords/passphrases
    must meet the specificed regex; (v) User attempting to change password
    early.
