---
features:
  - |
    Allow the creating of a project with the additional, optional
    parameter of `explicit_project_id` instead of auto-creating a
    project_id from a uuid.

    Two Keystone deployments will have different identifiers for
    resources that should be common, such as projects. This identifier
    skew means that to track something for audit purposes you can only
    correlate on the resource name. But resource names are modifiable,
    and correlation is unreliable.
    
    The limiting fact for using the API to duplicate data from one
    Keystone system to another is the generation of the
    identifier. Since a new record always gets a new identifier, and
    the the value for the identifier can only be generated, the API
    does not allow matching of records. However, allowing all users to
    specify the identifiers when creating records would create the
    potential for "squatting" on the identifier, and also prevent
    synchronization.
    
    For normal project generation, the identifiers should be
    generated by the system.  The explicit identifier specification
    should be reserved for the synchronization use case only.

    The RBAC enforcement for the project creation API has been
    split. Normal creation should require a project or domain scoped
    token. Synchronization should require a system scoped token.
    These are the defaults. A New policy rule called
    "create_project_with_id" required the system:admin role by
    default.
    