---
features:
  - >
   [`blueprint implied-roles <https://blueprints.launchpad.net/keystone/+spec/implied-roles>`_]
   Keystone now supports creating implied roles. Role inference rules can now
   be added to indicate when the assignment of one role implies the assignment
   of another. The rules are of the form ``prior_role`` implies
   ``implied_role``. If a role is assigned a prior role, any token that
   contains that role will also contain all implied roles for that prior role.
   This process will continue evaluating additional rules such that one implied
   role can imply additional roles. The expansion of implied roles is
   controlled by the ``root_role`` option in the ``[assignment]`` section of
   `keystone.conf`.
