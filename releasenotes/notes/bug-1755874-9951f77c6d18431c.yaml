---
fixes:
  - |
    [`bug 1755874 <https://bugs.launchpad.net/keystone/+bug/1755874>`_]
    Users now can have the resource option ``min_password_age`` set which
    overrides the global security compliance ``minimum_password_age`` setting
    if the override is greater than the global option setting.

    If either of these values are set to ``-1`` the user may not change their
    password; if the global settin is used, it cannot be overridden by the
    user resource-option.