---
features:
  - >
    [`Bug 1645487 <https://bugs.launchpad.net/keystone/+bug/1645487>`_]
    added a new PCI-DSS feature that will require users to immediately change
    their password upon first use after an administrative password reset. The
    new feature can be enabled by setting `[security_compliance]
    change_password_required_after_reset` in `keystone.conf`.
