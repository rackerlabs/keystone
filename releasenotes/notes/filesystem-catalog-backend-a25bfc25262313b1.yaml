---
features:
  - >
   [` filesystem-catalog-backend <https://bugs.launchpad.net/keystone/+bug/1815966>`_]
   Added a new filesystem backend for catalog. Now Keystone support yaml file
   as the catalog's backend. Please note that it's a readonly backend.
   Operators should define the catalog structure firstly in the yaml file
   before starting Keystone service.
