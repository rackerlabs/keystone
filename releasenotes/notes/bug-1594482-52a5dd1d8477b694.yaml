---
fixes:
  - >
    [`bug 1594482 <https://bugs.launchpad.net/keystone/+bug/1594482>`_]
    When using the ``list_limit`` config option, the ``GET /services?name={service_name}``
    API was first truncating the list and then filtering by name.
    The logic was fixed to first filter by name and then truncate the result
    list to the desired limit.
