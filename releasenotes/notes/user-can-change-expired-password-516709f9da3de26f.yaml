---
features:
  - |
    Allows a user to change their own expired password. Added configuration
    setting ``[security_compliance] minimum_password_age`` that can be used
    to cause token authentication to be skipped if set to True and
    ``[security_compliance] password_expires_days`` has been set. This
    removes the need for an administrator to reset a user's password if it
    expires before they can change it.
