---
fixes:
  - >
    [`bug 1643301 <https://bugs.launchpad.net/keystone/+bug/1643301>`_]
    Bootstrapping keystone with LDAP identity backend is enabled, this means
    you needn't depend on admin token to create role assignments any more,
    and ``password`` is not a mandatory argument for the command, it will be
    ignored if the identity's backend is ``LDAP``.
