---
features:
  - >
    [`blueprint pci-dss-password-requirements-api <https://blueprints.launchpad.net/keystone/+spec/pci-dss-password-requirements-api>`_]
    Added a new API (``/v3/domains/{domain_id}/config/security_compliance``) to
    retrieve regular expression requirements for passwords, should a deployment
    have PCI enabled. Specifically, ``[security_compliance] password_regex`` and
    ``[security_compliance] password_regex_description`` will be returned.
