---
features:
  - |
    The default role for retrieving and listing credentials and EC2
    credentials is now allowing the ``service`` role.
upgrade:
  - |
    The default policy for ``identity:get_credential``, ``identity:list_credentials``,
    ``identity:ec2_get_credential`` and ``identity:ec2_list_credentials`` is updated
    to allow the ``service`` role.
