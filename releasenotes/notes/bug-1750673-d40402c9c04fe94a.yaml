features:
  - |
    [`bug 1750673 <https://bugs.launchpad.net/keystone/+bug/1750673>`_]
    The role assignments API now supports the ``admin``, ``member``, and
    ``reader`` default roles.
upgrade:
  - |
    [`bug 1750673 <https://bugs.launchpad.net/keystone/+bug/1750673>`_]
    The role assignments API uses new default policies that
    make it more accessible to end users and administrators in a
    secure way. Please consider these new defaults if your deployment
    overrides role assignments policies.
deprecations:
  - |
    [`bug 1750673 <https://bugs.launchpad.net/keystone/+bug/1750673>`_]
    The role assignment policies have been deprecated.
    The ``identity:list_role_assignments `` policies now use
    ``role:reader and system_scope:all`` instead of ``rule:admin_required``.
    These new defaults automatically account for system-scope and support
    a read-only role, making it easier for system administrators to
    delegate subsets of responsibility without compromising security.
    Please consider these new defaults if your deployment overrides the
    role assignments policies.
security:
  - |
    [`bug 1750673 <https://bugs.launchpad.net/keystone/+bug/1750673>`_]
    The role assignment API now uses system-scope and default roles to
    provide better accessibility to users in a secure way.
