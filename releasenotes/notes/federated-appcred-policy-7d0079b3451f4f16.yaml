---
upgrade:
  - |
    Six new configuration options have been added under the
    ``[application_credential]`` section.  Three control **local and LDAP
    users**; three control **federated users** (OIDC, SAML).

    **Local / LDAP users** (defaults preserve the historical behaviour):

    * ``enabled`` (boolean, default ``True``) — Set to ``False`` to prevent
      local and LDAP users from creating application credentials entirely.
    * ``max_duration_days`` (integer, default ``0`` = unlimited) — Maximum
      lifetime in days.  When set to a positive value, ``expires_at`` is
      automatically injected when absent, and requests that exceed the limit
      are rejected with HTTP 400.
    * ``allow_unrestricted`` (boolean, default ``True``) — Allow creation of
      unrestricted application credentials.  Set to ``False`` to block them.

    **Federated users** (secure defaults — action may be required):

    * ``federated_enabled`` (boolean, default ``True``) — Set to ``False`` to
      prevent federated users from creating application credentials entirely.
    * ``federated_max_duration_days`` (integer, default ``30``) — Maximum
      lifetime in days for application credentials created by federated users.
      When a federated user omits ``expires_at``, it is automatically set to
      ``now + federated_max_duration_days``.  A value of ``0`` disables the
      limit.  Requests that specify an ``expires_at`` beyond this maximum are
      rejected with HTTP 400.
    * ``federated_allow_unrestricted`` (boolean, default ``False``) — Allow
      federated users to create unrestricted application credentials.  Defaults
      to ``False`` because unrestricted credentials can manage other application
      credentials and trusts, representing a privilege escalation risk for
      credentials that may outlive the upstream IdP session.

    **Action required (federated only):** Keystone will **refuse to start**
    if ``federated_enabled = True`` (the default) and
    ``federated_max_duration_days = 0``.  This combination is rejected
    because it allows federated users to create credentials that outlive
    their IdP session with no operator-configurable limit.

    Before upgrading, choose one of:

    * Set a maximum lifetime (recommended)::

        [application_credential]
        federated_max_duration_days = 30

    * Disable application credentials for federated users entirely::

        [application_credential]
        federated_enabled = False

    The previous (unrestricted) behaviour cannot be preserved while
    ``federated_enabled = True``.  See
    `LP #2129010 <https://bugs.launchpad.net/keystone/+bug/2129010>`_ for
    the security motivation.
