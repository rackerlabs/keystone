---
deprecations:
  - >
    The commandline options `standard-threads, `pydev-debug-host` and
    `pydev-debug-port` are only used by Keystone eventlet model in Newton
    release before. They are deprecated now and will be removed in the next
    release.
  - >
    Templated Catalog is deprecated as of Stein. It was largely untested and
    did not enforce a correct catalog form being emitted. The templated
    catalog will be removed in the U release. It is advised deployments
    move to utilizing the SQL catalog backend.
