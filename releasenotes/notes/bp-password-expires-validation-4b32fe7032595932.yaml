---
features:
  - >
    [`blueprint password-expires-validation <https://blueprints.launchpad.net/keystone/+spec/password-expires-validation>`_]
    Token responses will now have a ``password_expires_at`` field under the
    ``user`` dictionary. If PCI support is enabled, the ``password_expires_at``
    field will be populated. Otherwise, it will default to ``None``.
