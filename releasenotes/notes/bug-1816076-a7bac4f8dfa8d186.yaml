---
features:
  - |
    [`bug 1816076 <https://bugs.launchpad.net/keystone/+bug/1816076>`_]
    Federated attributes can be used to query for users.  The three
    paramaters of idp_id, protocol_id, and unique_id together can be
    used to select a user from a Federated Identity provider that has
    previously authenticated via the identity service.
