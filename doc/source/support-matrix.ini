# This file contains a specification of what feature capabilities each driver
# is able to support. Feature capabilities include what API operations are
# supported, what backend behaviors features can be used and what aspects of
# the driver implementation can be configured. The capabilities can be
# considered to be structured into nested groups, but in this file they have
# been flattened for ease of representation. The section names represent the
# group structure. At the top level there are the following groups defined:
#
# - operation: Public API operations.
# - identity: Identity backend configuration options.
# - token: Token format configuration options.
#
# When considering which capabilities should be marked as mandatory, consider
# the following guiding principles.
#
# The 'status' field takes possible values:
#
# - mandatory: Unconditionally required to be implemented.
# - optional: Optional to support, but nice to have.
# - choice(group): At least one of the options within the named group
#                  must be implemented.
# - conditional(cond): Required, if the referenced condition is met.
#
# The value against each 'driver-impl-XXXX' entry refers to the level of the
# implementation of the feature in that driver:
#
# - complete: Fully implemented, expected to work at all times.
# - partial: Implemented, but with caveats about when it will work.
#            For example, some configurations or hardware or guest OS may not
#            support it.
# - missing: Not implemented at all.
#
# In the case of the driver being marked as 'partial', then
# 'driver-notes-XXX' entry should be used to explain the caveats around the
# implementation.
#
# The 'cli' field takes a list of nova client commands, separated by semicolon.
# These CLi commands are related to that feature.
# Example:
# cli=openstack domain list;openstack domain show <domain>
#
[targets]
# List of driver implementations for which we are going to track the status of
# features. This list only covers drivers that are in tree. Out of tree
# drivers should maintain their own equivalent document, and merge it with this
# when their code merges into core.
driver-impl-identity-sql=SQL-backed Identity
driver-impl-identity-ldap=LDAP-backend identity
driver-impl-identity-federation-saml2=Federation via SAMLv2
driver-impl-identity-federation-oidc=Federation via OpenID Connect

[operation.authenticate]
title=Authenticate users with the identity system
status=mandatory
notes=All identity systems must be capable of authenticating users.
cli=
driver-impl-identity-sql=complete
driver-impl-identity-ldap=complete
driver-impl-identity-federation-saml2=complete
driver-impl-identity-federation-oidc=complete

[operation.create-user]
title=Create a user in the identity system
status=optional
notes=The create user operation allows you to create a unique user identity in
  the identity backend using Keystone. Not all identity systems allow external
  write operations, so this feature is not considered to be mandatory.
cli=openstack user create
driver-impl-identity-sql=complete
driver-impl-identity-ldap=partial
driver-impl-identity-federation-saml2=missing
driver-impl-identity-federation-oidc=missing

[operation.user-project-role-assignment]
title=Assign a role directly to a user on a project
status=optional
notes=User-project role assignments are the simplest way to granularly
  manage authorization between end users and multitenancy in OpenStack. Support
  for this is dependent on whether the identity backend is capable of providing
  persistent user identifiers that can be used for tracking authorization in
  Keystone.
cli=openstack user role add
driver-impl-identity-sql=complete
driver-impl-identity-ldap=complete
driver-impl-identity-federation-saml2=missing
driver-impl-identity-federation-oidc=missing

[operation.user-group-membership]
title=Assign a role directly to a user on a project
status=optional
notes=User-group membership is a method for managing the authorization between
  groups of end users and multitenancy in OpenStack.
cli=openstack user role add
driver-impl-identity-sql=complete
driver-impl-identity-ldap=complete
driver-impl-identity-federation-saml2=complete
driver-impl-identity-federation-oidc=complete
