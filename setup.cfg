[metadata]
name = keystone
version = 2014.2
summary = OpenStack Identity
description-file =
    README.rst
author = OpenStack
author-email = openstack-dev@lists.openstack.org
home-page = http://www.openstack.org/
classifier =
    Environment :: OpenStack
    Intended Audience :: Information Technology
    Intended Audience :: System Administrators
    License :: OSI Approved :: Apache Software License
    Operating System :: POSIX :: Linux
    Programming Language :: Python
    Programming Language :: Python :: 2
    Programming Language :: Python :: 2.7
    Programming Language :: Python :: 2.6

[files]
packages =
    keystone
scripts =
    bin/keystone-all
    bin/keystone-manage

[global]
setup-hooks =
    pbr.hooks.setup_hook


[egg_info]
tag_build =
tag_date = 0
tag_svn_revision = 0

[build_sphinx]
all_files = 1
build-dir = doc/build
source-dir = doc/source

[compile_catalog]
directory = keystone/locale
domain = keystone

[update_catalog]
domain = keystone
output_dir = keystone/locale
input_file = keystone/locale/keystone.pot

[extract_messages]
keywords = _ gettext ngettext l_ lazy_gettext
mapping_file = babel.cfg
output_file = keystone/locale/keystone.pot
copyright_holder = OpenStack Foundation
msgid_bugs_address = https://bugs.launchpad.net/keystone

# NOTE(dstanek): Uncomment the [pbr] section below and remove the ext.apidoc
# Sphinx extension when https://launchpad.net/bugs/1260495 is fixed.
[pbr]
warnerrors = True
#autodoc_tree_index_modules = True
#autodoc_tree_root = ./keystone

[entry_points]
keystone.assignment =
    kvs = keystone.assignment.backends.kvs:Assignment
    ldap = keystone.assignment.backends.ldap:Assignment
    sql = keystone.assignment.backends.sql:Assignment

keystone.catalog =
    kvs = keystone.catalog.backends.kvs:Catalog
    sql = keystone.catalog.backends.sql:Catalog
    templated = keystone.catalog.backends.templated:Catalog

keystone.common.cache =
    mongo = keystone.common.cache.backends.mongo:MongoCacheBackend
    noop = keystone.common.cache.backends.noop:NoopCacheBackend

keystone.common.kvs =
    inmemdb = keystone.common.kvs.backends.inmemdb:MemoryBackend
    memcached = keystone.common.kvs.backends.memcached:MemcachedBackend

keystone.contrib.endpoint_filter =
    catalog_sql = keystone.contrib.endpoint_filter.backends.catalog_sql:EndpointFilterCatalog
    sql = keystone.contrib.endpoint_filter.backends.sql:EndpointFilter

keystone.contrib.federation =
    sql = keystone.contrib.federation.backends.sql:Federation

keystone.contrib.oauth1 =
    sql = keystone.contrib.oauth1.backends.sql:OAuth1

keystone.contrib.revoke =
    kvs = keystone.contrib.revoke.backends.kvs:Revoke
    sql = keystone.contrib.revoke.backends.sql:Revoke

keystone.contrib.stats =
    kvs = keystone.contrib.stats.backends.kvs:Stats

keystone.credential =
    sql = keystone.credential.backends.sql:Credential

keystone.identity =
    kvs = keystone.identity.backends.kvs:Identity
    ldap = keystone.identity.backends.ldap:Identity
    sql = keystone.identity.backends.sql:Identity

keystone.policy =
    rules = keystone.policy.backends.rules:Policy
    sql = keystone.policy.backends.sql:Policy

keystone.token =
    kvs = keystone.token.backends.kvs:Token
    memcache = keystone.token.backends.memcache:Token
    sql = keystone.token.backends.sql:Token

keystone.trust =
    kvs = keystone.trust.backends.kvs:Trust
    sql = keystone.trust.backends.sql:Trust

oslo.config.opts =
    keystone = keystone.common.config:list_opts
