- hosts: all
  tasks:
    - name: Set zuul_site_mirror_fqdn from env var if not defined
      when: zuul_site_mirror_fqdn is not defined
      set_fact:
        zuul_site_mirror_fqdn: "{{ lookup('env','zuul_site_mirror_fqdn') }}"

    - name: Install Required Packages/Docker and Setup Host
      shell: |
        set -xe;
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y \
          ca-certificates git make jq nmap curl uuid-runtime ipcalc
        curl -fsSL get.docker.com -o get-docker.sh
        sudo sh get-docker.sh
        make dev-deploy setup-host
        make dev-deploy k8s
      environment:
        zuul_site_mirror_fqdn: "{{ zuul_site_mirror_fqdn }}"
      args:
        chdir: "{{ zuul.projects['git.openstack.org/openstack/openstack-helm-infra'].src_dir }}"

    - name: Build Charts
      shell: |
        set -xe
        make all
      args:
        chdir: "{{ zuul.projects['git.openstack.org/openstack/openstack-helm'].src_dir }}"

    - name: Deploy Ingress
      shell: |
        set -xe;
        ./tools/deployment/developer/nfs/030-ingress.sh
      args:
        chdir: "{{ zuul.projects['git.openstack.org/openstack/openstack-helm'].src_dir }}"

    - name: Deploy NFS
      shell: |
        set -xe;
        ./tools/deployment/developer/nfs/040-nfs-provisioner.sh
      args:
        chdir: "{{ zuul.projects['git.openstack.org/openstack/openstack-helm'].src_dir }}"

    - name: Deploy mariadb
      shell: |
        set -xe;
        ./tools/deployment/developer/nfs/050-mariadb.sh
      args:
        chdir: "{{ zuul.projects['git.openstack.org/openstack/openstack-helm'].src_dir }}"

    - name: Deploy rabbitmq
      shell: |
        set -xe;
        ./tools/deployment/developer/nfs/060-rabbitmq.sh
      args:
        chdir: "{{ zuul.projects['git.openstack.org/openstack/openstack-helm'].src_dir }}"

    - name: Deploy memcached
      shell: |
        set -xe;
        ./tools/deployment/developer/nfs/070-memcached.sh
      args:
        chdir: "{{ zuul.projects['git.openstack.org/openstack/openstack-helm'].src_dir }}"

    - name: Build Local Image
      shell: |
        set -xe;
        sudo docker build https://git.openstack.org/openstack/loci.git \
            --build-arg PROJECT=keystone --tag gerrit-keystone \
            --build-arg PROJECT_REF={{ REF_PATH }} \
            --build-arg PROFILES="apache libapache2-mod-wsgi"
      vars:
        REF_PATH: "{{ zuul.ref }}"
      args:
        chdir: "{{ zuul.project.src_dir }}"

    - name: Deploy Keystone
      shell: |
        set -xe;
        make keystone
        helm install ./keystone \
            --namespace=openstack --name=keystone \
            --set images.tags.keystone_db_sync=gerrit-keystone \
            --set images.tags.keystone_fernet_setup=gerrit-keystone \
            --set images.tags.keystone_fernet_rotate=gerrit-keystone \
            --set images.tags.keystone_credential_setup=gerrit-keystone \
            --set images.tags.keystone_credential_rotate=gerrit-keystone \
            --set images.tags.keystone_api=gerrit-keystone \
            --set bootstrap.script={{ BOOTSTRAP }}
         ./tools/deployment/common/wait-for-pods.sh openstack
      args:
        chdir: "{{ zuul.projects['git.openstack.org/openstack/openstack-helm'].src_dir }}"
      vars:
        BOOTSTRAP: "\"openstack user create --domain default --password password demo; openstack role add --project admin --user demo admin\""

    - name: Run keystone functional tests
      shell: |
        set -xe;
        tox -e functional
      environment:
        KSTEST_ADMIN_URL: http://keystone.openstack:80
        KSTEST_PUBLIC_URL: http://keystone.openstack:80
        KSTEST_ADMIN_USERNAME: admin
        KSTEST_ADMIN_PASSWORD: password
        KSTEST_ADMIN_DOMAIN_ID: default
        KSTEST_USER_USERNAME: demo
        KSTEST_USER_PASSWORD: password
        KSTEST_USER_DOMAIN_ID: default
        KSTEST_PROJECT_NAME: admin
        KSTEST_PROJECT_DOMAIN_ID: default
      args:
        chdir: "{{ zuul.project.src_dir }}"
