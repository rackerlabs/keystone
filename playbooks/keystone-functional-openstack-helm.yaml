- hosts: all
  tasks:
    - name: Deploy Required Packages & Install Docker
      shell: |
        set -xe;
        ./tools/deployment/developer/common/000-install-packages.sh
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo apt-key add -
        sudo add-apt-repository "deb [arch=amd64] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable"
        sudo apt-get update
        sudo apt-get install docker.ce=17.12.0~ce-0~ubuntu -y
        ./tools/deployment/developer/common/010-deploy-k8s.sh
      args:
        chdir: "{{ zuul.project.src_dir }}/../openstack-helm"
      vars:
        OSH_INFRA_PATH: "{{ zuul_osh_infra_relative_path | default('') }}"
    - name: Setup OS Client
      shell: |
        set -xe;
        ./tools/deployment/developer/common/020-setup-client.sh
      args:
        chdir: "{{ zuul.project.src_dir }}/../openstack-helm"
    - name: Deploy Ingress, RabbitMQ, Memcached, MariaDB
      shell: |
        set -xe;
        ./tools/deployment/developer/common/030-ingress.sh &
        ./tools/deployment/developer/common/060-rabbitmq.sh &
        ./tools/deployment/developer/nfs/070-memcached.sh &
        make pull-images mariadb
        helm install ./mariadb --namespace=openstack \
            --name=mariadb --set pod.replicas.server=1 \
            --set volume.enabled=False &
      args:
        chdir: "{{ zuul.project.src_dir }}/../openstack-helm"
    - name: Build Local Image
      shell: |
        set -xe;
        # If running locally, this should get you REF_PATH
        # REF_PATH=$(git ls-remote | grep $(git rev-parse HEAD) | awk '{print $2}')
        sudo docker build https://git.openstack.org/openstack/loci.git \
            --build-arg FROM=osixia/ubuntu-light-baseimage:latest \
            --build-arg PROJECT=keystone --tag gerrit-keystone \
            --build-arg PROJECT_REF={{ REF_PATH }} \
            --build-arg PROFILES="apache libapache2-mod-wsgi"
      vars:
        REF_PATH: "{{ zuul.ref }}"
      args:
        chdir: "{{ zuul.project.src_dir }}"
    - name: Deploy Keystone
      shell: |
        set -xe;
        make keystone
        helm install ./keystone \
            --namespace=openstack --name=keystone \
            --set images.tags.keystone_db_sync=gerrit-keystone \
            --set images.tags.keystone_fernet_setup=gerrit-keystone \
            --set images.tags.keystone_fernet_rotate=gerrit-keystone \
            --set images.tags.keystone_credential_setup=gerrit-keystone \
            --set images.tags.keystone_credential_rotate=gerrit-keystone \
            --set images.tags.keystone_api=gerrit-keystone \
            --set bootstrap.enabled=false
         ./tools/deployment/common/wait-for-pods.sh openstack
         helm status keystone
      args:
        chdir: "{{ zuul.project.src_dir }}/../openstack-helm"
    - name: Create demo user
      shell: |
        export OS_AUTH_URL=http://keystone.openstack:80/v3/
        export OS_USERNAME=admin
        export OS_PASSWORD=password
        export OS_PROJECT_NAME=admin
        export OS_USER_DOMAIN_NAME=default
        export OS_IDENTITY_API_VERSION=3
        openstack user create --domain default --password password demo
        #TODO(gagehugo): Create another non-admin project for testing
        openstack role add --project admin --user demo admin
    - name: Run keystone functional tests
      shell: |
        set -xe;
        export KSTEST_ADMIN_URL='http://keystone.openstack:80'
        export KSTEST_PUBLIC_URL='http://keystone.openstack:80'
        export KSTEST_ADMIN_USERNAME='admin'
        export KSTEST_ADMIN_PASSWORD='password'
        export KSTEST_ADMIN_DOMAIN_ID='default'
        export KSTEST_USER_USERNAME='demo'
        export KSTEST_USER_PASSWORD='password'
        export KSTEST_USER_DOMAIN_ID='default'
        export KSTEST_PROJECT_NAME='admin'
        export KSTEST_PROJECT_DOMAIN_ID='default'
        tox -e functional
      args:
        chdir: "{{ zuul.project.src_dir }}"
