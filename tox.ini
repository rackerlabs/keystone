[tox]
minversion = 1.6
skipsdist = True
envlist = py26,py27,py33,pep8

[testenv]
usedevelop = True
install_command = pip install -U {opts} {packages}
setenv = VIRTUAL_ENV={envdir}
         LANG=en_US.UTF-8
         LANGUAGE=en_US:en
         LC_ALL=C
deps = -r{toxinidir}/requirements.txt
       -r{toxinidir}/test-requirements.txt
commands = python setup.py testr --testr-args='{posargs}'

[testenv:pep8]
commands = flake8

[tox:jenkins]
downloadcache = ~/cache/pip

[testenv:cover]
setenv = VIRTUAL_ENV={envdir}
commands = python setup.py testr --coverage --testr-args='{posargs}'

[testenv:venv]
commands = {posargs}

[testenv:debug]
# Use this environment to run a test with embedded pdb.set_trace()
# Note that this isn't needed if this testrepository bug is addressed:
#   https://bugs.launchpad.net/testrepository/+bug/902881

whitelist_externals=/bin/bash

commands =
 bash -c "python -m testtools.run discover -t ./ ./keystone/tests --list > /tmp/ks_all_tests"
 bash -c "grep {posargs} < /tmp/ks_all_tests > /tmp/ks_tests_to_run"
 python -m testtools.run discover --load-list /tmp/ks_tests_to_run

[flake8]
filename= *.py,keystone-*
show-source = true

# H803  Commit message should not end with a period (do not remove per list discussion)
ignore = H803

builtins = _
exclude=.venv,.git,.tox,build,dist,doc,*openstack/common*,*lib/python*,*egg,tools,vendor,.update-venv,*.ini
