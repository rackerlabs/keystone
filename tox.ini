[tox]
minversion = 1.6
skipsdist = True
envlist = py27,py34,pep8,docs,genconfig

[testenv]
usedevelop = True
install_command = pip install -U {opts} {packages}
setenv = VIRTUAL_ENV={envdir}
deps = -r{toxinidir}/test-requirements.txt
       .[ldap,memcache,mongodb]
commands = bash tools/pretty_tox.sh '{posargs}'
whitelist_externals = bash
passenv = http_proxy HTTP_PROXY https_proxy HTTPS_PROXY no_proxy NO_PROXY PBR_VERSION

[testenv:py34]
commands =
  python setup.py test \
      -t keystone.tests.unit.auth.test_controllers \
      -t keystone.tests.unit.backend.domain_config.test_sql \
      -t keystone.tests.unit.backend.role.test_sql \
      -t keystone.tests.unit.catalog.test_core \
      -t keystone.tests.unit.common.test_authorization \
      -t keystone.tests.unit.common.test_injection \
      -t keystone.tests.unit.common.test_json_home \
      -t keystone.tests.unit.common.test_manager \
      -t keystone.tests.unit.common.test_sql_core \
      -t keystone.tests.unit.common.test_utils \
      -t keystone.tests.unit.contrib.federation.test_utils \
      -t keystone.tests.unit.external.test_timeutils \
      -t keystone.tests.unit.test_auth_plugin \
      -t keystone.tests.unit.test_backend_endpoint_policy \
      -t keystone.tests.unit.test_backend_endpoint_policy_sql \
      -t keystone.tests.unit.test_backend_federation_sql \
      -t keystone.tests.unit.test_backend_id_mapping_sql \
      -t keystone.tests.unit.test_backend \
      -t keystone.tests.unit.test_backend_rules \
      -t keystone.tests.unit.test_config \
      -t keystone.tests.unit.test_contrib_ec2 \
      -t keystone.tests.unit.test_contrib_s3_core \
      -t keystone.tests.unit.test_driver_hints \
      -t keystone.tests.unit.test_exception \
      -t keystone.tests.unit.test_ipv6 \
      -t keystone.tests.unit.test_policy \
      -t keystone.tests.unit.test_singular_plural \
      -t keystone.tests.unit.test_sql_livetest \
      -t keystone.tests.unit.test_sql_migrate_extensions \
      -t keystone.tests.unit.test_sql_upgrade \
      -t keystone.tests.unit.test_ssl \
      -t keystone.tests.unit.tests.test_core \
      -t keystone.tests.unit.tests.test_utils \
      -t keystone.tests.unit.test_token_bind \
      -t keystone.tests.unit.test_url_middleware \
      -t keystone.tests.unit.test_v2_controller \
      -t keystone.tests.unit.test_v3_controller \
      -t keystone.tests.unit.test_validation \
      -t keystone.tests.unit.test_wsgi \
      -t keystone.tests.unit.token.test_pki_provider \
      -t keystone.tests.unit.token.test_pkiz_provider \
      -t keystone.tests.unit.token.test_token_model \
      -t keystone.tests.unit.token.test_uuid_provider

[testenv:pep8]
commands =
  flake8 {posargs}
  # Run bash8 during pep8 runs to ensure violations are caught by
  # the check and gate queues
  bashate examples/pki/gen_pki.sh
  # Check that .po and .pot files are valid.
  bash -c "find keystone -type f -regex '.*\.pot?' -print0| \
           xargs -0 -n 1 msgfmt --check-format -o /dev/null"

[tox:jenkins]
downloadcache = ~/cache/pip

[testenv:cover]
commands = python setup.py testr --coverage --testr-args='{posargs}'

[testenv:venv]
commands = {posargs}

[testenv:debug]
commands = oslo_debug_helper {posargs}

[testenv:functional]
basepython = python3.4
deps = -r{toxinidir}/test-requirements.txt
setenv = OS_TEST_PATH=./keystone/tests/functional
commands = python setup.py testr --slowest --testr-args='{posargs}'

[flake8]
filename= *.py,keystone-all,keystone-manage
show-source = true

# H405  multi line docstring summary not separated with an empty line
ignore = H405

exclude=.venv,.git,.tox,build,dist,doc,*openstack/common*,*lib/python*,*egg,tools,vendor,.update-venv,*.ini,*.po,*.pot
max-complexity=24

[testenv:docs]
commands=
    bash -c "rm -rf doc/build"
    bash -c "rm -rf doc/source/api"
    python setup.py build_sphinx

[testenv:genconfig]
commands = oslo-config-generator --config-file=config-generator/keystone.conf

[testenv:bandit]
deps = .[bandit]
commands = bandit -c bandit.yaml -r keystone -n5 -p gate

[hacking]
import_exceptions =
  keystone.i18n
  six.moves
local-check-factory = keystone.tests.hacking.checks.factory
