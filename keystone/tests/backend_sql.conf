[database]
# For file based db (sqlite), don't change this to support parallel workers.
connection = sqlite://

# To utilize alternative backends, it is important to also configure testr to run a single worker.
# This is accomplished by adding uncommenting the 'test_run_concurrency' line in the .testr.conf

#To Test MySQL:
#connection = mysql://keystone:keystone@localhost/keystone?charset=utf8
#To Test PostgreSQL:
#connection = postgresql://keystone:keystone@localhost/keystone?client_encoding=utf8
idle_timeout = 200

[identity]
driver = keystone.identity.backends.sql.Identity

[token]
driver = keystone.token.backends.sql.Token

[ec2]
driver = keystone.contrib.ec2.backends.sql.Ec2

[catalog]
driver = keystone.catalog.backends.sql.Catalog

[policy]
driver = keystone.policy.backends.sql.Policy

[trust]
driver = keystone.trust.backends.sql.Trust
