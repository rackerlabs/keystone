- job:
    name: tempest-dsvm-py35
    parent: legacy-dsvm-base
    run: playbooks/legacy/tempest-dsvm-py35/run.yaml
    post-run: playbooks/legacy/tempest-dsvm-py35/post.yaml
    timeout: 10800
    required-projects:
      - openstack-infra/devstack-gate
      - openstack/tempest
    irrelevant-files:
      - ^.*\.rst$
      - ^api-ref/.*$
      - ^doc/.*$
      - ^etc/.*$
      - ^keystone/tests/unit/.*$
      - ^releasenotes/.*$

